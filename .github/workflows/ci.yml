name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run ts-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package build
        run: npm run build:ci

      - name: Install libraries for the packaged-app smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libnss3 libgtk-3-0t64 libasound2t64

      # Launch the real packaged binary and confirm a window renders. This
      # catches packaging faults (e.g. a dependency that is not bundled and
      # fails to resolve at runtime) that compile cleanly but crash the app on
      # launch, which the source-level tests cannot see.
      - name: Smoke test that the packaged app launches
        timeout-minutes: 5
        run: xvfb-run --auto-servernum node scripts/smoke-test-packaged.mjs

  website:
    name: Website
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Lint website
        working-directory: website
        run: npm run lint

      # next build type-checks the whole app against website/tsconfig.json
      # (its own next types and @/* alias), so this covers the website's
      # TypeScript check as well as the production build.
      - name: Build website
        working-directory: website
        run: npm run build
