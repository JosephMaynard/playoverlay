version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  # The website is a separate Next.js app with its own package.json and
  # lockfile (not an npm workspace), so the root entry above never sees it.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # The CodeQL init and analyze actions must run the same version, so
    # action bumps go up in one PR rather than one per action.
    groups:
      actions:
        patterns:
          - "*"
